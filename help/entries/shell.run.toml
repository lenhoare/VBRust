id = "shell.run"
title = "Run"
category = "Shell"
kind = "method"
parent = "shell"
anchor = "ns/Shell.Run"

summary = "Runs a command, waits for it to finish, and returns its output."

arguments = """
command | String | The command line to run.
"""

returns = "String — everything the command printed. Fails if it couldn't be run."

example = """
Function Main()
    Dim out As String = Shell.Run("echo hello")
    Debug.Print out
End Function
"""

see_also = ["shell", "shell.start", "handle"]
