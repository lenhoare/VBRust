id = "datetime.add_days"
title = "Add_Days"
category = "DateTime"
kind = "method"
parent = "datetime"
anchor = "ns/DateTime.Add_Days"

summary = "A new DateTime shifted by a number of days."

arguments = """
n | Long | How many days to add. A negative number moves backwards.
"""

returns = "DateTime — a new value; the original is unchanged. Add_Hours(n) and Add_Minutes(n) shift by hours and minutes the same way."

example = """
Function Main()
    Dim d As DateTime = DateTime.Parse("2026-08-14", "%Y-%m-%d")

    Debug.Print d.Add_Days(7).Format("%Y-%m-%d")    ' 2026-08-21
    Debug.Print d.Add_Days(-1).Format("%Y-%m-%d")   ' 2026-08-13
End Function
"""

see_also = ["datetime", "datetime.diff_days"]
