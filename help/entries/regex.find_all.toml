id = "regex.find_all"
title = "Find_All"
category = "Regex"
kind = "method"
parent = "regex"
anchor = "ns/Regex.Find_All"

summary = "Every substring that matches the pattern."

arguments = """
pattern | String | The regular expression to search for.
text | String | The text to search in.
"""

returns = "Vec<String> — one String per match (empty if none). Fails if the pattern is invalid."

example = """
Function Main()
    Dim words As Vec<String> = Regex.Find_All("[a-z]+", "ab 12 cd 34")
    Debug.Print words.Len()   ' 2
End Function
"""

see_also = ["regex", "regex.is_match", "vec"]
