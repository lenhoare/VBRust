id = "filesystem.read"
title = "Read"
category = "FileSystem"
kind = "method"
parent = "filesystem"
anchor = "ns/FileSystem.Read"

summary = "Reads a whole file into a String."

arguments = """
path | String | The path of the file to read.
"""

returns = "String — the file's contents. Fails if the file can't be read (missing, no permission)."

example = """
Function Main()
    FileSystem.Write("greeting.txt", "hello")
    Dim text As String = FileSystem.Read("greeting.txt")
    Debug.Print text
End Function
"""

see_also = ["filesystem", "filesystem.read_lines", "filesystem.write", "handle"]
