id = "filesystem.read"
title = "Read"
category = "FileSystem"
kind = "method"
parent = "filesystem"
anchor = "ns/FileSystem.Read"

summary = "Reads a whole file into a String."

arguments = """
path | String | The path of the file to read.
"""

returns = "Result<String> — Ok with the file's contents, or Err(message) if the file can't be read (missing, no permission)."

example = """
Function Main()
    FileSystem.Write("greeting.txt", "hello").Unwrap()

    Match FileSystem.Read("greeting.txt")
        Ok(text) => Debug.Print text
        Err(e)   => Debug.Print "could not read: " & e
    End Match
End Function
"""

see_also = ["filesystem", "filesystem.readlines", "filesystem.write", "result"]
