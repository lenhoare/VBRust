id = "json.getstring"
title = "GetString"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.GetString"

summary = "The string value stored at a key."

arguments = """
key | String | The key whose value to read.
"""

returns = "Result<String> — Ok with the string, or Err(message) if the key is missing or isn't a string. GetInt, GetFloat and GetBool work the same way for those types."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""city"": ""London""}").Unwrap()
    Debug.Print doc.GetString("city").Unwrap()   ' London
End Function
"""

see_also = ["json", "json.getint", "json.get", "json.haskey"]
