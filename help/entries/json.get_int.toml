id = "json.get_int"
title = "Get_Int"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.Get_Int"

summary = "The integer value stored at a key."

arguments = """
key | String | The key whose value to read.
"""

returns = "Long — the number. Fails if the key is missing or isn't an integer."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""count"": 42}")
    Debug.Print doc.Get_Int("count")   ' 42
End Function
"""

see_also = ["json", "json.get_string", "json.get"]
