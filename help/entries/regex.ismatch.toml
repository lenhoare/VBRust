id = "regex.ismatch"
title = "IsMatch"
category = "Regex"
kind = "method"
parent = "regex"
anchor = "ns/Regex.IsMatch"

summary = "Whether a pattern is found anywhere in the text."

arguments = """
pattern | String | The regular expression to search for.
text | String | The text to search in.
"""

returns = "Result<Boolean> — Ok(True) if the pattern matches, Ok(False) if not, or Err(message) if the pattern is invalid."

example = """
Function Main()
    Debug.Print Regex.IsMatch("cat", "the cat sat").Unwrap()   ' True
    Debug.Print Regex.IsMatch("dog", "the cat sat").Unwrap()   ' False
End Function
"""

see_also = ["regex", "regex.findall"]
