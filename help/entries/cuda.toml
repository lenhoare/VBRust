id = "cuda"
title = "CUDA"
category = "Parallel"
kind = "namespace"
anchor = "ns/CUDA"

syntax = """
Dim a As CudaBuffer<Single> = CUDA.Upload(xs)
Dim b As CudaBuffer<Single> = CUDA.Alloc(n)
Dim m As CudaBuffer<Long> = CUDA.Managed(n)
Dim result As Vec<Single> = CUDA.Download(b)

CUDA.Prefetch(m)
CUDA.PrefetchHost(m)
CUDA.Sync()

Dim grid As CudaBuffer<CudaBuffer<Long>> = CUDA.Upload(rows)
Dim out As CudaBuffer<CudaBuffer<Long>> = CUDA.Alloc(ny, nx)
"""

summary = "Copy numeric lists onto an NVIDIA GPU and back — where Parallel For on those buffers runs."

remarks = """
`CUDA` names **where** work runs. `Parallel` names **independence**. A `Parallel For` over `CudaBuffer`s is the GPU claim; the same loop over ordinary `Vec`s stays on CPU threads. There is no silent upload of a host `Vec`.

The element type comes from `Dim … As CudaBuffer<T>` — not `Alloc<Single>` / `Managed<Single>`, which the parser would read as a comparison. Fallible calls (no GPU, out of memory) use implicit `?` like `FileSystem.Read`. `CUDA` is not a `vbr_stdlib` crate — the compiler emits the driver/nvrtc loader only when the program uses it.

Mixing a `Vec` and a `CudaBuffer` in one `Parallel For` is an error. Mixing 1-D and 2-D buffers in one loop is an error too. Nested `Parallel For y` / `Parallel For x` over 2-D buffers is one CUDA launch. Python and C refuse CUDA rather than faking a host array. The full surface is `parallel_spec.md`.
"""

members = """
method | Upload(xs)              | Copy a numeric Vec (or Vec<Vec>) onto the GPU. Returns CudaBuffer (can fail).
method | Alloc(n)                | Empty 1-D device buffer; T from Dim As. Can fail.
method | Alloc(rows, cols)       | Empty 2-D device grid. Needs CudaBuffer<CudaBuffer<T>>. Can fail.
method | Managed(n)              | Same CudaBuffer type; host index allowed. Can fail.
method | Managed(rows, cols)     | 2-D managed grid. Can fail.
method | Download(buf)           | Copy a CudaBuffer back to a host Vec (or Vec<Vec>). Can fail.
method | Prefetch(buf)           | Page a Managed buffer toward the GPU. Optional. Can fail.
method | PrefetchHost(buf)       | Page a Managed buffer toward the CPU. Optional. Can fail.
method | Sync()                  | Wait for the GPU and outstanding prefetch. Can fail.
"""

example = """
Function Main()
    Dim src As Vec<Vec<Long>> = [[1, 2, 3], [4, 5, 6]]
    Dim a As CudaBuffer<CudaBuffer<Long>> = CUDA.Upload(src)
    Dim b As CudaBuffer<CudaBuffer<Long>> = CUDA.Alloc(2, 3)
    Parallel For y = 0 To 1
        Parallel For x = 0 To 2
            b[y][x] = a[y][x] * 2
        Next
    Next
    Dim result As Vec<Vec<Long>> = CUDA.Download(b)
    Debug.Print result[0][0]
End Function
"""

see_also = ["cuda-buffer", "cuda.upload", "cuda.alloc", "cuda.managed", "cuda.download", "cuda.prefetch", "parallel-for", "parallel-sum"]
