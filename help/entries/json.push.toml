id = "json.push"
title = "Push"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.Push"

summary = "Appends a value to a JSON array."

arguments = """
val | Json | The value to add to the end of the array.
"""

returns = "Nothing — the array grows in place. Build the values you push with Json.Object() or the string/number helpers."

example = """
Function Main()
    Dim list As Json = Json.Array()

    Dim first As Json = Json.Object()
    first.SetString("name", "Ada")
    list.Push(first)

    Debug.Print list.ToString().Unwrap()   ' [{"name":"Ada"}]
End Function
"""

see_also = ["json", "json.object", "json.tostring"]
