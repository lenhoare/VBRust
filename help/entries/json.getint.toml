id = "json.getint"
title = "GetInt"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.GetInt"

summary = "The integer value stored at a key."

arguments = """
key | String | The key whose value to read.
"""

returns = "Result<Long> — Ok with the number, or Err(message) if the key is missing or isn't an integer."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""count"": 42}").Unwrap()
    Debug.Print doc.GetInt("count").Unwrap()   ' 42
End Function
"""

see_also = ["json", "json.getstring", "json.get"]
