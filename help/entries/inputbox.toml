id = "inputbox"
title = "InputBox"
category = "String functions"
kind = "function"

syntax = """
InputBox(<prompt>)
"""

summary = "Prints a prompt and reads a line from the keyboard."

remarks = """
There is no dialog window — Bust prints the prompt and reads one line from stdin. The line comes back as a `String`, without the trailing newline.

Closed input fails, the same way `FileSystem.Read` fails on a missing file: end of a pipe, or Ctrl+D on an empty line. The error leaves the current function unless you intercept that one call with `Handle err`. A blank Enter is success with an empty string, not a failure.

`InputBox` takes one argument, the prompt. There is no default-button / title form.
"""

example = """
Function Main()
    Dim name As String = InputBox("What is your name? ")
    Debug.Print "Hello, " & name
End Function
"""

see_also = ["handle", "raiseerror", "filesystem.read"]
