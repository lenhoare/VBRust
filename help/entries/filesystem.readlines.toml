id = "filesystem.readlines"
title = "ReadLines"
category = "FileSystem"
kind = "method"
parent = "filesystem"
anchor = "ns/FileSystem.ReadLines"

summary = "Reads a file as a list of its lines."

arguments = """
path | String | The path of the file to read.
"""

returns = "Result<Vec<String>> — Ok with one String per line (no trailing newlines), or Err(message) on failure."

example = """
Function Main()
    FileSystem.Write("list.txt", "one" & vbCrLf & "two" & vbCrLf & "three").Unwrap()

    Dim lines As Vec<String> = FileSystem.ReadLines("list.txt").Unwrap()
    Debug.Print lines.Len()   ' 3
End Function
"""

see_also = ["filesystem", "filesystem.read", "vec"]
