id = "filesystem.delete"
title = "Delete"
category = "FileSystem"
kind = "method"
parent = "filesystem"
anchor = "ns/FileSystem.Delete"

summary = "Deletes a file."

arguments = """
path | String | The path of the file to delete.
"""

returns = "Nothing on success. Fails if the file is missing or can't be removed."

example = """
Function Main()
    FileSystem.Write("temp.txt", "scratch")
    FileSystem.Delete("temp.txt")

    Debug.Print FileSystem.Exists("temp.txt")   ' False
End Function
"""

see_also = ["filesystem", "filesystem.exists"]
