id = "filesystem.delete"
title = "Delete"
category = "FileSystem"
kind = "method"
parent = "filesystem"
anchor = "ns/FileSystem.Delete"

summary = "Deletes a file."

arguments = """
path | String | The path of the file to delete.
"""

returns = "Result — Ok on success, or Err(message) if the file is missing or can't be removed."

example = """
Function Main()
    FileSystem.Write("temp.txt", "scratch").Unwrap()
    FileSystem.Delete("temp.txt").Unwrap()

    Debug.Print FileSystem.Exists("temp.txt")   ' False
End Function
"""

see_also = ["filesystem", "filesystem.exists"]
