id = "dataframe.read_csv"
title = "Read_Csv"
category = "DataFrame"
kind = "method"
parent = "dataframe"
anchor = "ns/DataFrame.Read_Csv"

summary = "Loads a CSV file into a DataFrame."

arguments = """
path | String | The path of the CSV file. The first row is taken as the column names.
"""

returns = "DataFrame — the table, with each column's type inferred from its values. Common blank/NA tokens are read as missing values."

example = """
Function Main()
    Dim df As DataFrame = DataFrame.Read_Csv("people.csv")
    df.Print()
End Function
"""

see_also = ["dataframe", "dataframe.with_column", "dataframe.column"]
