id = "regex.replace_all"
title = "Replace_All"
category = "Regex"
kind = "method"
parent = "regex"
anchor = "ns/Regex.Replace_All"

summary = "Replaces every match of a pattern."

arguments = """
pattern | String | The regular expression to search for.
text | String | The text to search in.
replacement | String | What to put in place of each match.
"""

returns = "String — the edited text (unchanged if nothing matched). Fails if the pattern is invalid."

example = """
Function Main()
    Dim hidden As String = Regex.Replace_All("[0-9]", "id 4 8 15", "#")
    Debug.Print hidden   ' id # # ##
End Function
"""

see_also = ["regex", "regex.replace", "regex.find_all"]
