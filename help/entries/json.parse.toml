id = "json.parse"
title = "Parse"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.Parse"

summary = "Parses JSON text into a Json value you can read."

arguments = """
text | String | The JSON text to parse. (In a Bust string, an inner quote is written as two: "").
"""

returns = "Json — the parsed value. Fails if the text isn't valid JSON."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""name"": ""Ada"", ""age"": 36}")

    Debug.Print doc.Get_String("name")   ' Ada
    Debug.Print doc.Get_Int("age")       ' 36
End Function
"""

see_also = ["json", "json.get_string", "json.object"]
