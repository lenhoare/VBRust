id = "json.parse"
title = "Parse"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.Parse"

summary = "Parses JSON text into a Json value you can read."

arguments = """
text | String | The JSON text to parse. (In a VBR string, an inner quote is written as two: "").
"""

returns = "Result<Json> — Ok with the parsed value, or Err(message) if the text isn't valid JSON."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""name"": ""Ada"", ""age"": 36}").Unwrap()

    Debug.Print doc.GetString("name").Unwrap()   ' Ada
    Debug.Print doc.GetInt("age").Unwrap()       ' 36
End Function
"""

see_also = ["json", "json.getstring", "json.object"]
