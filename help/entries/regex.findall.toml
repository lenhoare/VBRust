id = "regex.findall"
title = "FindAll"
category = "Regex"
kind = "method"
parent = "regex"
anchor = "ns/Regex.FindAll"

summary = "Every substring that matches the pattern."

arguments = """
pattern | String | The regular expression to search for.
text | String | The text to search in.
"""

returns = "Result<Vec<String>> — Ok with one String per match (empty if none), or Err(message) if the pattern is invalid."

example = """
Function Main()
    Dim words As Vec<String> = Regex.FindAll("[a-z]+", "ab 12 cd 34").Unwrap()
    Debug.Print words.Len()   ' 2
End Function
"""

see_also = ["regex", "regex.ismatch", "vec"]
