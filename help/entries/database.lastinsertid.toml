id = "database.lastinsertid"
title = "LastInsertId"
category = "Database"
kind = "method"
parent = "database"
anchor = "ns/Database.LastInsertId"

summary = "The rowid assigned to the most recent insert."

returns = "Long — the id of the last inserted row. Handy for grabbing the auto-generated primary key after an INSERT. Not a Result."

example = """
Function Main()
    Dim db As Database = Database.Open(":memory:").Unwrap()
    db.Execute("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT)", []).Unwrap()

    db.Execute("INSERT INTO users (name) VALUES (?)", ["Ada"]).Unwrap()
    Debug.Print db.LastInsertId()   ' 1
End Function
"""

see_also = ["database", "database.execute"]
