id = "set"
title = "Set"
category = "Declarations"
kind = "keyword"

syntax = """
Set <name> = <value>
Set Mut <name> = <value>
"""

replaces = "Set (for object references)"

summary = "Binds a name that borrows a value instead of copying it."

remarks = """
Where `Dim` makes an independent variable, `Set` makes a name that *points at* an existing value — no copy is made. Both names then see the same data. This matters for big values like strings or `Vec`s where copying would be wasteful.

`Set Mut` borrows *mutably*: changes through the new name affect the original. (This is Bust's take on classic VB's `Set` for object references, made explicit about sharing versus copying.)
"""

example = """
Function Main()
    Dim greeting As String = "hello"
    Set alias = greeting        ' alias borrows greeting — no copy

    Debug.Print alias
    Debug.Print greeting
End Function
"""

see_also = ["dim", "nothing"]
