id = "dataframe.join"
title = "Join"
category = "DataFrame"
kind = "method"
parent = "dataframe"
anchor = "ns/DataFrame.Join"

summary = "Combines two DataFrames on a shared column."

arguments = """
other | DataFrame | The DataFrame to join with.
key | String | The column both tables share; rows are matched where its values are equal.
"""

returns = "DataFrame — a new table with the columns of both, for the rows whose key matched."

example = """
Function Main()
    Dim people As DataFrame = DataFrame.Read_Csv("people.csv")
    Dim orders As DataFrame = DataFrame.Read_Csv("orders.csv")

    Dim buyers As DataFrame = people.Join(orders, "name")
    buyers.Print()
End Function
"""

see_also = ["dataframe", "dataframe.group_by"]
