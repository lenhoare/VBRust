id = "json.tostring"
title = "ToString"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.ToString"

summary = "Renders the Json value as compact JSON text."

returns = "Result<String> — Ok with the JSON on one line, or Err(message) if it can't be rendered. ToPretty() gives the same thing nicely indented over several lines."

example = """
Function Main()
    Dim doc As Json = Json.Object()
    doc.SetString("name", "Ada")

    Debug.Print doc.ToString().Unwrap()   ' {"name":"Ada"}
End Function
"""

see_also = ["json", "json.object", "json.setstring"]
