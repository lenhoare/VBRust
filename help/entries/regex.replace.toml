id = "regex.replace"
title = "Replace"
category = "Regex"
kind = "method"
parent = "regex"
anchor = "ns/Regex.Replace"

summary = "Replaces the first match of a pattern."

arguments = """
pattern | String | The regular expression to search for.
text | String | The text to search in.
replacement | String | What to put in place of the first match.
"""

returns = "Result<String> — Ok with the edited text (unchanged if nothing matched), or Err(message) if the pattern is invalid."

example = """
Function Main()
    Dim once As String = Regex.Replace("o", "foo", "0").Unwrap()
    Debug.Print once   ' f0o
End Function
"""

see_also = ["regex", "regex.replaceall"]
