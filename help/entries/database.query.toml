id = "database.query"
title = "Query"
category = "Database"
kind = "method"
parent = "database"
anchor = "ns/Database.Query"

summary = "Runs a SELECT and returns the rows."

arguments = """
sql | String | The SELECT statement, with ? placeholders for any values.
params | Vec<String> | The values for the ? placeholders. Pass [] for none.
"""

returns = "Vec<Json> — one Json object per row (read its columns with Get_String / Get_Int). Fails if the query fails."

example = """
Function Main()
    Dim db As Database = Database.Open(":memory:")
    db.Execute("CREATE TABLE users (name TEXT)", [])
    db.Execute("INSERT INTO users (name) VALUES (?)", ["Ada"])

    Dim rows As Vec<Json> = db.Query("SELECT name FROM users", [])
    For Each row In rows
        Debug.Print row.Get_String("name")   ' Ada
    Next
End Function
"""

see_also = ["database", "database.execute", "json"]
