id = "window"
title = "Window"
category = "Surfaces"
kind = "keyword"
anchor = "kw/Window"

syntax = """
Window <Name>
    Title "<title>"
    Theme <Name>

    State
        Dim <name> As <Type> = <init>
    End State

    View
        Column
            Text <expr>
            Button "<label>"
                On Click <Event>
            End Button
        End Column
    End View

    Event <Event>
        ...
    End Event
End Window
"""

replaces = "Form"

summary = "A desktop GUI — buttons, sliders, text. State is the truth; the view is derived from it."

remarks = """
A `Window` is a pixel desktop app (Iced). The shape is always the same: `State` holds the data, `View` describes the widgets from that data, `Event` handlers change the state — then the view redraws. There is no hidden control object to poke.

Everyday widgets: `Text`, `Button`, `TextInput`, `TextArea`, `Checkbox`, `Toggler`, `Slider`, `ProgressBar`, `Radio`, `Image`, `Svg`, `Markdown`. Layout is `Column` / `Row` with `Spacing` and `Padding`; `Scrollable` and `Rule Horizontal` / `Rule Vertical` sit beside them. Bind a control to a state field (`Slider 0..=100, volume`) and handle `On Click` / `On Change` / `On Input` / `On Submit` / `On Toggle` / `On Select`. A `Match` or `If` in the View picks which widgets show.

The same names a Screen uses for structure work here too: `Frame` (a bordered box), `Tabs` (an `Integer` index, 0 = first tab), `List` (`Vec<String>`), `Table` (`Vec<Struct>` — columns from the struct's fields). `Chooser field From options` is a dropdown; `options` is a `Vec` of the same type as `field`.

`TextInput` may take `On Submit` (Enter) and `Secure` (hide the typed characters). `Button` may take `Enabled <expr>`. `Slider` may take `Step n` and `Vertical`. `Chooser` may take `Search` (a searchable combo box; options are snapshotted when the window opens). `Markdown <expr>` renders a `String` as Markdown. `Svg` is a path, like `Image`. `QrCode <expr>` draws a QR from a string.

`Stack` paints children on top of each other. `Tooltip "hint"` wraps a child (`Position Top` / `Bottom` / `Left` / `Right` / `FollowCursor`). `MouseArea` watches `On Click` / `On Right Click` / `On Enter` / `On Exit` / `On Move` (move hands two `Single`s). `Responsive [width]` picks `Narrow` or `Wide` by pixel width (default 600). `goodexamples/folio` is the forms showcase; `examples/gui_extras.vbr` is Stack / Tooltip / Search / Vertical / MouseArea / Responsive / QrCode.

Need a drawing *and* buttons? Put a `Canvas` in the View. Need only a drawing? Use a `Sketch` instead — `Gpu Draw` if the picture is a pixel kernel.

`Theme Dracula` (or `NightOwl`, `JellyFish`, `Nord`, …) restyles the whole window. The palette is chosen when the window opens. Launch it from `Function Main()` with `<Name>.Run`. A program is one kind of surface — don't mix a Window with a Screen or a Page.
"""

example = """
Window Counter
    Title "Counter"

    State
        Dim count As Long = 0
    End State

    View
        Column
            Text "Count: " & count
            Button "+"
                On Click Increment
            End Button
            Button "-"
                On Click Decrement
            End Button
        End Column
    End View

    Event Increment
        count += 1
    End Event

    Event Decrement
        count -= 1
    End Event
End Window

Function Main()
    Counter.Run
End Function
"""

see_also = ["screen", "page", "sketch", "gpu-draw", "theme", "await"]
