id = "json"
title = "Json"
category = "Standard library"
kind = "namespace"
anchor = "ns/Json"

summary = "Read and build JSON data."

remarks = """
`Json.Parse(text)` turns JSON text into a **Json value**; `Json.Object()` and `Json.Array()` start an empty one to build up. A Json value then has its own methods.

**Read** with the typed accessors — `GetString`, `GetInt`, `GetFloat`, `GetBool`, `GetArray`, and `Get` (for a nested object). Each returns a **Result**, because the key might be missing or hold a different type. `HasKey` checks first. **Build** with `SetString`, `SetInt`, `SetBool`, `Set` (a nested Json), and `Push` (onto an array). `ToString` / `ToPretty` render it back to text.

Needs the `json` feature — build as a project.
"""

members = """
method | Parse(text)         | Parse JSON text into a Json value. Returns Result<Json>.
method | Object()            | A new, empty JSON object to build up. Returns Json.
method | Get(key)            | The nested Json value at a key. Returns Result<Json>.
method | GetString(key)      | The string at a key. Returns Result<String>. (GetInt/GetFloat/GetBool too.)
method | GetInt(key)         | The integer at a key. Returns Result<Long>.
method | HasKey(key)         | Whether a key is present. Returns Boolean.
method | SetString(key, val) | Set a string on an object. (SetInt/SetBool/Set too.)
method | Push(val)           | Append a value to an array.
method | ToString()          | Render as compact JSON text. Returns Result<String>.
"""

example = """
Function Main()
    Dim doc As Json = Json.Object()
    doc.SetString("name", "Ada")
    doc.SetInt("age", 36)

    Debug.Print doc.GetString("name").Unwrap()   ' Ada
    Debug.Print doc.ToString().Unwrap()          ' {"name":"Ada","age":36}
End Function
"""

see_also = ["json.parse", "json.getstring", "database", "http"]
