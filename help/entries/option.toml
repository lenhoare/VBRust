id = "option"
title = "Option<T>"
category = "Collections & wrappers"
kind = "type"

syntax = """
Dim <name> As Option<<T>> = Some(<value>)
Dim <name> As Option<<T>> = None
"""

replaces = "Nothing / Is_Null checks"

summary = "A value that might be there — or might be absent — made explicit."

remarks = """
`Option<T>` holds either `Some(value)` or `None`. It is how Bust says "there might be nothing here" *in the type*, so you can't forget to check — no more accidental `Nothing`/null surprises. Lookups like `HashMap.Get` and `InStr` hand you an `Option`.

Get at the value by testing first: `If maybe Is Some(v) Then …`, or a `Match` with `Some`/`None` arms. When you're willing to supply a fallback, `.UnwrapOr(default)` gives the value or the default.
"""

members = """
property | .Is_Some()          | True when a value is present.
property | .Is_None()          | True when it is empty.
method   | .Unwrap_Or(default) | The value if present, otherwise the given default.
"""

example = """
Function Main()
    Dim found As Option<Long> = Some(42)

    If found Is Some(v) Then
        Debug.Print v
    End If

    Dim missing As Option<Long> = None
    Debug.Print missing.Unwrap_Or(0)
End Function
"""

see_also = ["handle", "is", "match", "hashmap"]
