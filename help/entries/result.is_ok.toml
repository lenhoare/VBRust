id = "result.is_ok"
title = "Is_Ok"
category = "Result<T>"
kind = "property"
parent = "result"
anchor = "m/Result.Is_Ok"

summary = "Whether a Raw result is a success."

returns = "Boolean — True for Ok, False for Err."

example = """
Function Always(n As Long) As Long
    Return n
End Function

Function Main()
    Dim r As Result<Long> = Raw Always(5)
    Debug.Print r.Is_Ok()    ' True
End Function
"""

