id = "datetime.diffdays"
title = "DiffDays"
category = "DateTime"
kind = "method"
parent = "datetime"
anchor = "ns/DateTime.DiffDays"

summary = "The whole number of days between two DateTimes."

arguments = """
other | DateTime | The DateTime to compare against.
"""

returns = "Long — how many whole days from this DateTime to the other (negative if the other is earlier). DiffHours(other) does the same in hours."

example = """
Function Main()
    Dim start As DateTime = DateTime.Parse("2026-08-01", "%Y-%m-%d").Unwrap()
    Dim finish As DateTime = DateTime.Parse("2026-08-14", "%Y-%m-%d").Unwrap()

    Debug.Print start.DiffDays(finish)   ' 13
End Function
"""

see_also = ["datetime", "datetime.adddays"]
