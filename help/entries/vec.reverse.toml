id = "vec.reverse"
title = "Reverse"
category = "Vec<T>"
kind = "method"
parent = "vec"
anchor = "m/Vec.Reverse"

summary = "Flips the order of the items end to end."

returns = "Nothing — the list is reversed in place."

example = """
Function Main()
    Dim v As Vec<Long> = [1, 2, 3]
    v.Reverse()
    Debug.Print v.First().Unwrap_Or(-1)  ' 3
End Function
"""

see_also = ["vec", "vec.sort"]
