id = "filesystem"
title = "FileSystem"
category = "Standard library"
kind = "namespace"
anchor = "ns/FileSystem"

summary = "Read and write files on disk."

remarks = """
`FileSystem` groups the everyday file operations — read a file's text, write or append to one, list a folder, check whether it exists, copy it, delete it. It needs no setup and no external crates.

Most calls can fail, because the disk can refuse (a missing file, no permission). A normal call propagates that error; intercept it with `Handle err`. `Exists` is the exception — it simply returns a `Boolean`.

Because it reaches outside the program, a file-using program is built as a **project**: run it with `vbr runproject` (or `vbr build`), not the single-file `vbr run`.
"""

members = """
method | Read(path)         | Read a whole file as a String. Can fail.
method | Read_Lines(path)    | Read a file as a Vec of its lines. Can fail.
method | List(path)          | Names in a folder (directories end with /). Can fail.
method | Join(a, b)          | Join two path pieces with `/`.
method | Parent(path)        | The folder that contains this path.
method | Name(path)          | The last component of a path.
method | Write(path, text)  | Write text to a file, replacing any existing content. Can fail.
method | Append(path, text) | Add text to the end of a file, creating it if needed. Can fail.
method | Exists(path)       | Whether a file exists. Returns Boolean.
method | Copy(source, dest) | Copy a file to another path. Can fail.
method | Delete(path)       | Delete a file. Can fail.
"""

example = """
Function Main()
    FileSystem.Write("notes.txt", "Hello from Bust")

    Dim text As String = FileSystem.Read("notes.txt")
    Debug.Print text

    Debug.Print FileSystem.Exists("notes.txt")   ' True
    FileSystem.Delete("notes.txt")
End Function
"""

see_also = ["handle", "shell", "json"]
