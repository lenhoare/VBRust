id = "json.get"
title = "Get"
category = "Json"
kind = "method"
parent = "json"
anchor = "ns/Json.Get"

summary = "The nested Json value stored at a key."

arguments = """
key | String | The key whose value to fetch.
"""

returns = "Json — the value as a Json (which you read further with Get_String, Get_Int, …). Fails if the key is missing."

example = """
Function Main()
    Dim doc As Json = Json.Parse("{""user"": {""name"": ""Ada""}}")

    Dim user As Json = doc.Get("user")
    Debug.Print user.Get_String("name")   ' Ada
End Function
"""

see_also = ["json", "json.get_string", "json.has_key"]
