id = "question"
title = "? (try)"
category = "Collections & wrappers"
kind = "operator"

syntax = """
Dim <name> As <T> = <fallible call>?
"""

replaces = "On Error error-handling"

summary = "Forwards an error upward, unwrapping the success value on the happy path."

remarks = """
A `?` after a fallible call means "if this failed, stop and return that failure from the current function; otherwise give me the value inside." It turns nested error-checking into a single character, keeping the successful path readable.

It works on `Result` (and `Option`), and the enclosing function must itself return the matching kind — you can only forward an error out of a function that is allowed to fail.
"""

example = """
Function ParseAge(s As String) As Result<Long>
    Dim n As Long = Val(s)
    If n <= 0 Then
        Return Err("not a valid age")
    End If
    Return Ok(n)
End Function

Function Describe(s As String) As Result<String>
    Dim age As Long = ParseAge(s)?      ' an Err here returns from Describe
    Return Ok("age is " & CStr(age))
End Function

Function Main()
    Match Describe("36")
        Ok(msg) => Debug.Print msg
        Err(e) => Debug.Print e
    End Match
End Function
"""

see_also = ["result", "option", "match"]
