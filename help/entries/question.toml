id = "question"
title = "? (try)"
category = "Collections & wrappers"
kind = "operator"

syntax = """
<a> = <call>()
"""

replaces = "On Error error-handling"

summary = "Gone from ordinary Bust — a call already propagates."

remarks = """
You do not write `?`. A fallible call already forwards failure out of the current function and gives you the success value. Intercept with `Handle err`. Fail from here with `RaiseError`. Take the box with `Raw`.
"""

example = """
Function ParseAge(s As String) As Long
    Dim n As Long = CLng(s)
    If n <= 0 Then RaiseError "not a valid age"
    Return n
End Function

Function Describe(s As String) As String
    Dim age As Long = ParseAge(s)
    Return "age is " & CStr(age)
End Function

Function Main()
    Debug.Print Describe("36")
End Function
"""

see_also = ["handle", "raiseerror", "raw", "result"]
