id = "http.get"
title = "Get"
category = "Http"
kind = "method"
parent = "http"
anchor = "ns/Http.Get"

summary = "Fetches the response at a URL as text."

arguments = """
url | String | The address to fetch (http or https).
"""

returns = "String — the response body as text. Fails if the request fails (bad host, no network, error status)."

example = """
Function Main()
    Dim body As String = Http.Get("https://example.com")
    Debug.Print "got " & Len(body) & " bytes"
End Function
"""

see_also = ["http", "http.post", "await", "handle"]
