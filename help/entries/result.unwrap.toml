id = "result.unwrap"
title = "Unwrap"
category = "Result<T>"
kind = "method"
parent = "result"
anchor = "m/Result.Unwrap"

caution = ["unwrap-training-wheels"]

summary = "Gone. Errors propagate automatically."

returns = "Do not write `.Unwrap()`. A normal call already yields T. To intercept a call, use Handle err."

example = """
Function Half(n As Long) As Long
    If n Mod 2 <> 0 Then RaiseError "not even"
    Return n / 2
End Function

Function Main()
    Dim h As Long = Half(10) Handle err
        Debug.Print err
        Return
    End Handle
    Debug.Print h
End Function
"""

see_also = ["handle", "raiseerror", "result", "result.unwrap_or"]
