id = "long"
title = "Long"
category = "Data types"
kind = "type"

syntax = """
Dim <name> As Long
"""

summary = "The everyday whole-number type (Rust i64)."

remarks = """
`Long` is the type to reach for when you want a whole number and have no special reason to pick another. It maps to Rust's `i64`, so it comfortably holds counts, indices, and most integer arithmetic without overflow.

For fractional values use `Double`; for genuinely huge integers use `LongLong`.
"""

example = """
Function Main()
    Dim total As Long = 0

    For n = 1 To 100
        total = total + n
    Next

    Debug.Print total
End Function
"""

see_also = ["integer", "longlong", "double"]
