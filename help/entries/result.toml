id = "result"
title = "Result<T>"
category = "Collections & wrappers"
kind = "type"

syntax = """
Dim <name> As Result<<T>> = Raw <call>()
Match <name>
    Ok(<value>) => ...
    Err(<message>) => ...
End Match
"""

replaces = "On Error and the Err object"

summary = "The underlying success-or-failure box — only when you ask for it with Raw."

remarks = """
Ordinary Bust never writes `Result`. A function declares its success type (`As Long`); a normal call gives you that value, or fails. To look at the box itself, prefix the call with `Raw`.

The box is either `Ok(value)` or `Err(message)`. Inspect it with `Match`. `.Is_Ok` / `.Is_Err` / `.Unwrap_Or` work on a Raw result. `.Unwrap()` is gone — intercept with `Handle` instead.
"""

members = """
property | .Is_Ok()            | True when the result succeeded.
property | .Is_Err()           | True when it failed.
method   | .Unwrap_Or(default) | The Ok value, or the given default on Err.
"""

example = """
Function Half(n As Long) As Long
    If n Mod 2 <> 0 Then RaiseError "not even"
    Return n / 2
End Function

Function Main()
    Dim r As Result<Long> = Raw Half(10)
    Match r
        Ok(h) => Debug.Print h
        Err(e) => Debug.Print e
    End Match
End Function
"""

see_also = ["raw", "handle", "raiseerror", "option", "match"]
