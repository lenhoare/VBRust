id = "shell.start"
title = "Start"
category = "Shell"
kind = "method"
parent = "shell"
anchor = "ns/Shell.Start"

summary = "Launches a command without waiting, returning a Process handle."

arguments = """
command | String | The command line to launch.
"""

returns = "Process — a Process you control. Fails if it couldn't start. The Process has .Wait() (block until it finishes, returning its exit code), .Is_Running() (Boolean), and .Kill()."

example = """
Function Main()
    Dim p As Process = Shell.Start("sleep 1")

    Debug.Print p.Is_Running()   ' True
    Dim code As Long = p.Wait()
    Debug.Print code            ' 0
End Function
"""

see_also = ["shell", "shell.run"]
