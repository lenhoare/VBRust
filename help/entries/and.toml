id = "and"
title = "And"
category = "Operators"
kind = "operator"

syntax = """
<condition> And <condition>
"""

summary = "True when both conditions are true."

remarks = """
`And` combines two conditions and is true only when *both* are. It pairs naturally with `Or` (either) and `Not` (negate).

In Bust `And` is a logical test between `Boolean` values — use it in `If`, `Do While`, and the like.
"""

example = """
Function Main()
    Dim age As Long = 30

    If age >= 18 And age < 65 Then
        Debug.Print "working age"
    End If
End Function
"""

see_also = ["or", "not", "xor", "if"]
