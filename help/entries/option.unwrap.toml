id = "option.unwrap"
title = "Unwrap"
category = "Option<T>"
kind = "method"
parent = "option"
anchor = "m/Option.Unwrap"

caution = ["unwrap-training-wheels"]

summary = "Gone. Use Is Some, Match, or Unwrap_Or."

returns = "Do not write `.Unwrap()`. Prefer `If x Is Some(v) Then`, `Match`, or `.Unwrap_Or(default)`."

example = """
Function Main()
    Dim found As Option<Long> = Some(7)
    Debug.Print found.Unwrap_Or(0)   ' 7
End Function
"""

see_also = ["option", "option.unwrap_or", "is", "match"]
