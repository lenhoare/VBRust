id = "screen"
title = "Screen"
category = "Surfaces"
kind = "keyword"
anchor = "kw/Screen"

syntax = """
Screen <Name>
    Title "<title>"
    Theme <Name>

    State
        Dim <name> As <Type> = <init>
    End State

    Status <expr>
    On Key "<key>" <Event> ["<label>"]

    View
        Column
            Text <expr>
        End Column
    End View

    Event <Event>
        ...
    End Event
End Screen
"""

summary = "A terminal UI — keyboard-first, text widgets, a status bar. Same State / View / Events as a Window."

remarks = """
A `Screen` is a terminal app (ratatui). The Elm machine is the same as a Window: `State` is the truth, `View` is derived, `Event`s change state. The difference is the dress — no mouse buttons, no pixels. Input is keys.

Bind keys with `On Key "+" Increment "inc"`. `Quit` is built-in (`On Key "q" Quit`). An optional string after the handler is the hotkey label on the bottom bar. `Status "Count: " & count` puts live text on the left of that bar. `Every 16 Tick` fires a timer event.

Widgets that belong here: `Text`, `Input`, `Memo`, `List`, `Table`, `Chart`, `Tabs`, `Frame`. A `List` or `Table` joins the focus ring (Up/Down, Enter); an `Input` types when focused. `GetOpenFilename` / `GetSaveAsFilename` pop a path prompt — Screen-only.

`Theme NightOwl` restyles chrome, text, and charts. Omit it and the bar stays cyan-on-black (Turbo Pascal). Launch with `<Name>.Run`. A program is one kind of surface — don't mix a Screen with a Window or a Page.
"""

example = """
Screen Counter
    Title "Counter"

    State
        Dim count As Integer = 0
    End State

    Status "Count: " & count
    On Key "+" Increment "inc"
    On Key "-" Decrement "dec"
    On Key "q" Quit "quit"

    View
        Column
            Text "Count: " & count
            Text "+/− to change, q to quit"
        End Column
    End View

    Event Increment
        count += 1
    End Event

    Event Decrement
        count -= 1
    End Event
End Screen

Function Main()
    Counter.Run
End Function
"""

see_also = ["window", "page", "sketch", "theme", "await"]
