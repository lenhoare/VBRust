<!DOCTYPE html>
<!-- GENERATED into help/build/site/ by `vbr help build` — do not edit there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBR Help</title>
<style>
  :root {
    --bg: #f4f4ef; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b76;
    --line: #e0e0d8; --nav: #002a6e; --accent: #ffd23f; --link: #0b4fb0;
    --code: #f6f7f2; --codeln: #e6e7de;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    background: var(--nav); color: #fff; padding: 0 16px; height: 48px; flex: 0 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: .5px; font-family: "Cascadia Code", Consolas, monospace; }
  .brand span { color: var(--accent); }
  #search {
    flex: 1; max-width: 520px; height: 30px; border: 0; border-radius: 4px;
    padding: 0 10px; font-size: 14px; background: #fff;
  }
  .count { color: #b9c6e6; font-size: 12px; font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 300px; min-width: 180px; max-width: 560px; flex: 0 0 auto;
    overflow-y: auto; background: var(--panel); padding: 8px 0;
  }
  .cat {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); padding: 12px 14px 4px; font-weight: 700;
  }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px;
    color: var(--ink); text-decoration: none; font-size: 14px;
  }
  .drag {
    flex: 0 0 auto; width: 6px; cursor: col-resize; background: transparent;
    border-right: 1px solid var(--line);
  }
  .drag:hover, body.dragging .drag { background: #c9d3ef; border-right-color: var(--nav); }
  body.dragging { cursor: col-resize; user-select: none; }
  .item:hover { background: #eef1fb; }
  .item.cur { background: #e3e9fb; font-weight: 600; border-right: 3px solid var(--nav); }
  .k {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 3px; font-size: 11px; font-weight: 700;
    color: #fff; flex: 0 0 auto;
  }
  .k-keyword { background: #6a3fb0; }
  .k-function { background: #0b7a52; }
  .k-type { background: #b06a00; }
  .k-operator { background: #b0344f; }
  .k-namespace { background: #0a6a70; }
  section {
    flex: 1; overflow-y: auto; padding: 28px 40px; max-width: 900px;
  }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .anchor { font-family: "Cascadia Code", Consolas, monospace; }
  h1 { margin: 0 0 6px; font-size: 28px; display: flex; align-items: center; gap: 12px; }
  h1 .k { width: auto; height: 20px; padding: 0 8px; border-radius: 4px; font-size: 12px; }
  h2 { margin: 26px 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--nav); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .summary { font-size: 16px; color: #33333a; }
  pre {
    background: var(--code); border: 1px solid var(--codeln); border-radius: 6px;
    padding: 12px 14px; overflow-x: auto; margin: 0;
    font: 13.5px/1.5 "Cascadia Code", Consolas, "Courier New", monospace;
  }
  pre.syntax { background: #fbf7e6; border-color: #efe4b8; }
  pre code { font: inherit; background: none; }
  /* Syntax colours (build-time highlighting). */
  .t-kw { color: #7c3aed; font-weight: 600; }
  .t-type { color: #0b6bcb; }
  .t-str { color: #0a7d43; }
  .t-num { color: #b26a00; }
  .t-comment { color: #8a8a94; font-style: italic; }
  .replaces {
    display: flex; align-items: center; gap: 12px; margin: 18px 0 4px;
    background: #fff4e0; border: 1px solid #f0cf8f; border-left: 5px solid #e8961e;
    border-radius: 6px; padding: 10px 14px;
  }
  .rep-tag {
    font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    color: #fff; background: #e8961e; padding: 3px 9px; border-radius: 4px; white-space: nowrap;
  }
  .rep-body { font-size: 15px; color: #5c4200; }
  .rep-body b { color: #7a3e00; font-family: "Cascadia Code", Consolas, monospace; }
  .code { position: relative; }
  .copy {
    position: absolute; top: 7px; right: 7px; z-index: 1;
    border: 1px solid var(--codeln); background: #fff; color: var(--muted);
    border-radius: 4px; padding: 2px 9px; font-size: 12px; cursor: pointer;
    opacity: 0; transition: opacity .12s;
  }
  .code:hover .copy, .copy:focus { opacity: 1; }
  .copy:hover { color: var(--ink); border-color: var(--muted); }
  .copy.ok { color: #0b7a52; border-color: #0b7a52; opacity: 1; }
  table.members { border-collapse: collapse; width: 100%; margin: 6px 0 4px; }
  table.members td { border-bottom: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
  table.members tr:last-child td { border-bottom: 0; }
  td.msig { width: 34%; white-space: nowrap; }
  td.msig code {
    background: var(--code); border: 1px solid var(--codeln); border-radius: 4px;
    padding: 1px 6px; font: 13px "Cascadia Code", Consolas, monospace; color: #7a3e00;
  }
  td.mdesc { color: #33333a; }
  td.msig a { text-decoration: none; }
  td.msig a code { color: var(--link); border-color: #ccd7f0; }
  td.msig a:hover code { background: #eef1fb; border-color: var(--nav); }
  .argty { color: var(--muted); font: 12px "Cascadia Code", Consolas, monospace; margin-left: 4px; }
  .returns { background: #eef7f0; border-left: 4px solid #0a7d43; border-radius: 4px; padding: 8px 12px; color: #234; }
  .crumb a { color: var(--link); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .see { display: flex; flex-wrap: wrap; gap: 8px; }
  .see a {
    background: #eef1fb; color: var(--link); text-decoration: none;
    padding: 3px 10px; border-radius: 12px; font-size: 13px;
  }
  .see a:hover { background: #dbe3fb; }
  .see-stub {
    background: #f0f0ea; color: var(--muted); padding: 3px 10px;
    border-radius: 12px; font-size: 13px; border: 1px dashed var(--line);
  }
  .welcome { color: var(--muted); margin-top: 40px; }
  .welcome h1 { color: var(--ink); }
  kbd {
    background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 12px;
  }
  .empty { color: var(--muted); padding: 20px 14px; }
</style>
</head>
<body>
  <header>
    <div class="brand">VBR&nbsp;<span>Help</span></div>
    <input id="search" type="search" placeholder="Search topics…  (press /)" autocomplete="off" autofocus>
    <div id="count" class="count"></div>
  </header>
  <main>
    <nav id="list"></nav>
    <div id="drag" class="drag" title="Drag to resize"></div>
    <section id="content"></section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
